<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rent Radar</title>
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">  <!-- Leaflet 1.9.4, BSD-2, vendored -->
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot" aria-hidden="true"></span>Rent Radar</div>
  <div class="seg" id="campusSeg" role="radiogroup" aria-label="Your campus"></div>
  <button class="ghost" id="aboutBtn">About the data</button>
</header>

<main>
  <aside class="panel" id="panel">
    <form class="ask" id="askForm">
      <label for="q" class="sr">Describe what you need</label>
      <textarea id="q" rows="2" placeholder="What do you need? e.g. under $2,500, quiet, bike to MIT"></textarea>
      <button type="submit" id="askBtn" class="primary">Ask</button>
    </form>
    <div class="chips" id="examples"></div>

    <section id="understood" class="understood hidden"></section>

    <div class="listhead">
      <h2 id="listTitle">Best matches</h2>
      <button class="ghost small" id="adjustBtn" aria-expanded="false">Adjust</button>
    </div>

    <section class="adjust hidden" id="adjust">
      <div class="grid2">
        <label>Max rent<input id="maxPrice" type="number" step="100" placeholder="Any"></label>
        <label>Min bedrooms<input id="minBeds" type="number" min="0" max="6" placeholder="Any"></label>
      </div>
      <label class="toggle"><input id="showOlder" type="checkbox"> Show older backups (listed 91–180 days ago, may be gone)</label>
      <label class="toggle"><input id="showCambridge" type="checkbox"> Include Cambridge (listings only, no city records yet)</label>
      <h3>What matters to you</h3>
      <div id="weights"></div>
      <button class="link" id="resetW" type="button">Reset to defaults</button>
    </section>

    <ol class="cards" id="cards"></ol>
  </aside>

  <div id="map" aria-label="Map of listings"></div>

  <aside class="detail hidden" id="detail" aria-label="Listing details">
    <button class="close" id="closeDetail" aria-label="Close">×</button>
    <div id="detailBody"></div>
  </aside>
</main>

<dialog id="about">
  <button class="close" id="closeAbout" aria-label="Close">×</button>
  <div id="aboutBody"></div>
</dialog>

<script src="/static/vendor/leaflet/leaflet.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
